name: Build Hub

# index.html and fr/index.html are generated by scripts/build_hub.py.
# Edit scripts/build_hub.py (e.g. the BRANDS list) on GitHub; this rebuilds the pages.

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/build_hub.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate index.html and fr/index.html
        run: python3 scripts/build_hub.py
      - name: Commit and push generated pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html fr/index.html
          git diff --staged --quiet || git commit -m "chore: rebuild hub pages [skip ci]"
          git push
