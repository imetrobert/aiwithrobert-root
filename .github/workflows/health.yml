name: Weekly health check

# Every Monday, and on demand (Actions > Weekly health check > Run workflow).
# A red run means something needs action: GitHub emails you, and the run page shows exactly what.
on:
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Check every app, certificate, domain and renewal
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/health_check.py
